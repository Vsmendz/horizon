[package]
name = "horizon-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Safe operating-system services shared by Horizon clients and servers"

[target.'cfg(not(target_os = "horizon"))'.dependencies]
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

[target.'cfg(target_os = "horizon")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
